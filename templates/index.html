<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NovelBuddy Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 16px; padding: 2rem; width: 100%; max-width: 520px; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; color: #fff; }
  p.sub { color: #888; font-size: .85rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: .8rem; color: #aaa; margin-bottom: .3rem; }
  input { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; padding: .65rem .85rem; color: #fff; font-size: .95rem; outline: none; margin-bottom: 1rem; transition: border .2s; }
  input:focus { border-color: #6c63ff; }
  button#startBtn { width: 100%; padding: .75rem; background: #6c63ff; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; }
  button#startBtn:hover { background: #574fd6; }
  button#startBtn:disabled { background: #3a3a3a; cursor: not-allowed; color: #666; }
  #progress-wrap { margin-top: 1.5rem; display: none; }
  #log { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1rem; height: 240px; overflow-y: auto; font-family: monospace; font-size: .78rem; line-height: 1.7; color: #ccc; }
  #log .ok   { color: #4caf82; }
  #log .warn { color: #f0a500; }
  #log .err  { color: #f44336; }
  #log .info { color: #888; }
  #downloadBtn { display: none; width: 100%; margin-top: 1rem; padding: .75rem; background: #2e7d52; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  #downloadBtn:hover { background: #245f3e; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #555; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>📖 NovelBuddy Downloader</h1>
  <p class="sub">Downloads all chapters as .txt files in a ZIP</p>

  <label>Novel slug <span style="color:#555">(from the URL)</span></label>
  <input id="slug" type="text" placeholder="e.g. under-the-oak-tree"/>

  <label>Novel title</label>
  <input id="title" type="text" placeholder="e.g. Under the Oak Tree"/>

  <label>First chapter slug <span style="color:#555">(leave blank for chapter-1)</span></label>
  <input id="first" type="text" placeholder="chapter-1"/>

  <button id="startBtn" onclick="startDownload()">Start Download</button>

  <div id="progress-wrap">
    <div id="log"></div>
    <button id="downloadBtn" onclick="triggerDownload()">⬇ Download ZIP</button>
  </div>
</div>

<script>
let currentJobId = null;
let pollInterval = null;
let logIndex = 0;

function startDownload() {
  const slug  = document.getElementById('slug').value.trim();
  const title = document.getElementById('title').value.trim();
  const first = document.getElementById('first').value.trim() || 'chapter-1';

  if (!slug || !title) { alert('Please enter both slug and title.'); return; }

  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Running...';

  document.getElementById('log').innerHTML = '';
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('downloadBtn').style.display = 'none';
  logIndex = 0;

  if (pollInterval) clearInterval(pollInterval);

  fetch('/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug, title, first })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { appendLog('err', data.error); resetBtn(); return; }
    currentJobId = data.job_id;
    // Poll every 1.5s
    pollInterval = setInterval(() => poll(data.job_id), 1500);
  })
  .catch(e => { appendLog('err', 'Failed to start: ' + e); resetBtn(); });
}

function poll(jobId) {
  fetch(`/poll/${jobId}?after=${logIndex}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) { appendLog('err', data.error); stopPolling(); return; }

      (data.lines || []).forEach(line => {
        if (line.startsWith('✓'))       appendLog('ok',   line);
        else if (line.startsWith('⚠'))  appendLog('warn', line);
        else if (line.startsWith('❌'))  appendLog('err',  line);
        else                            appendLog('info', line);
      });
      logIndex += (data.lines || []).length;

      if (data.done) {
        stopPolling();
        resetBtn();
        if (data.zip_name) {
          document.getElementById('downloadBtn').style.display = 'block';
        }
      }
    })
    .catch(() => {
      // silently retry on network blip
    });
}

function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

function resetBtn() {
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.textContent = 'Start Download';
}

function appendLog(cls, msg) {
  const log = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function triggerDownload() {
  if (currentJobId) window.location.href = `/download/${currentJobId}`;
}
</script>
</body>
</html>
